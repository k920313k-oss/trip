<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>關西五日行程</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f5ef;
      --card: #fffefa;
      --ink: #26332f;
      --muted: #77827b;
      --line: #e8e6de;
      --green: #315f50;
      --green-pale: #e8f0e9;
      --orange: #d58050;
      --shadow: 0 12px 32px rgba(38, 51, 47, .055);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 116px; }
    body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.6; }
    button, a { font: inherit; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      padding: max(10px, env(safe-area-inset-top)) 16px 11px;
      background: rgba(247, 245, 239, .94); backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(232, 230, 222, .9);
    }
    .topline { max-width: 760px; margin: 0 auto 9px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-size: 12px; color: var(--muted); letter-spacing: .12em; font-weight: 700; }
    .trip-label { font-size: 11px; color: var(--green); background: var(--green-pale); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
    .day-nav { max-width: 760px; margin: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; }
    .day-nav button {
      border: 1px solid var(--line); border-radius: 12px; min-height: 42px;
      background: rgba(255, 254, 250, .78); color: var(--muted); font-weight: 750; font-size: 13px;
      cursor: pointer; transition: background .18s, color .18s, border-color .18s, transform .18s;
    }
    .day-nav button:active { transform: scale(.97); }
    .day-nav button[aria-current="date"], .day-nav button.active { background: var(--green); border-color: var(--green); color: white; }
    main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
    .intro { padding: 12px 4px 22px; }
    .eyebrow { margin: 0 0 4px; color: var(--orange); text-transform: uppercase; letter-spacing: .16em; font-size: 10px; font-weight: 800; }
    h1 { margin: 0; font-size: clamp(23px, 6vw, 31px); line-height: 1.25; letter-spacing: -.035em; }
    .intro-date { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .file-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .file-action { min-height: 38px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--card); color: var(--green); font-size: 12px; font-weight: 750; cursor: pointer; }
    .file-action.primary { background: var(--green); border-color: var(--green); color: #fff; }
    .file-action:active { transform: translateY(1px); }
    #import-file { display: none; }
    .day-section { scroll-margin-top: 116px; margin: 0 0 24px; }
    .day-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 0 3px 11px; }
    .day-title { display: flex; align-items: baseline; gap: 10px; }
    .day-number { color: var(--green); font-size: 12px; font-weight: 850; letter-spacing: .08em; }
    .day-heading h2 { margin: 0; font-size: 20px; letter-spacing: -.025em; }
    .weekday { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .panel { background: var(--card); border: 1px solid rgba(232, 230, 222, .9); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
    .panel-title { margin: 0; padding: 15px 16px 9px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .drag-hint { margin: -5px 16px 7px; color: #9aa39c; font-size: 10px; }
    .places { padding: 0 13px 5px; }
    .place { display: grid; grid-template-columns: 28px 25px minmax(0, 1fr) auto; align-items: start; gap: 8px; padding: 12px 3px; border-bottom: 1px solid var(--line); background: var(--card); transition: background .15s, opacity .15s, box-shadow .15s; }
    .place:last-child { border-bottom: 0; }
    .place.dragging { opacity: .55; user-select: none; -webkit-user-select: none; }
    .place.drag-over { box-shadow: inset 0 2px 0 var(--orange); }
    .drag-handle { width: 28px; min-height: 38px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 9px; background: transparent; color: #9aa39c; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
    .drag-handle:active { color: var(--green); background: var(--green-pale); cursor: grabbing; }
    .drag-handle svg { width: 17px; height: 17px; }
    .pin { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; background: var(--green-pale); color: var(--green); font-size: 12px; font-weight: 850; margin-top: 1px; }
    .place-name { font-size: 14px; line-height: 1.4; font-weight: 750; }
    .place-name { cursor: text; touch-action: manipulation; }
    .place-name:focus-visible { outline: 2px solid #9ab5a4; outline-offset: 3px; border-radius: 3px; }
    .rename-input { width: 100%; min-width: 0; padding: 5px 7px; border: 1px solid #9ab5a4; border-radius: 8px; color: var(--ink); background: #fff; font: inherit; font-weight: 700; }
    .place-desc { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .map-link { display: inline-flex; align-items: center; gap: 4px; align-self: center; text-decoration: none; color: var(--green); background: #f1f5f0; border: 1px solid #e5ece4; border-radius: 10px; padding: 7px 9px; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .map-link svg { width: 13px; height: 13px; }
    .meals { display: grid; grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--line); padding: 4px 16px 13px; }
    .meal { display: grid; grid-template-columns: 43px 1fr; gap: 8px; padding: 8px 0 0; font-size: 12px; }
    .meal-label { color: var(--muted); font-weight: 700; }
    .hotel { margin-top: 10px; padding: 15px 16px; background: #edf2eb; border: 1px solid #e0e9df; border-radius: 16px; }
    .hotel-label { display: flex; align-items: center; gap: 7px; margin: 0 0 5px; color: var(--green); font-size: 11px; font-weight: 850; letter-spacing: .08em; }
    .hotel-label svg { width: 15px; height: 15px; }
    .hotel-name { margin: 0; color: #35453e; font-size: 12px; line-height: 1.6; }
    .no-hotel { color: var(--muted); font-style: italic; }
    .footer { margin: 28px 4px 0; text-align: center; color: #929a93; font-size: 11px; }
    @media (min-width: 600px) {
      .topbar { padding-left: 24px; padding-right: 24px; }
      main { padding: 26px 24px 60px; }
      .meals { grid-template-columns: 1fr 1fr; column-gap: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topline">
      <span class="brand">TRAVEL NOTES</span>
      <span class="trip-label">關西・京都・大阪</span>
    </div>
    <nav class="day-nav" aria-label="前往行程日">
      <button type="button" data-target="day-1">Day 1</button>
      <button type="button" data-target="day-2">Day 2</button>
      <button type="button" data-target="day-3">Day 3</button>
      <button type="button" data-target="day-4">Day 4</button>
      <button type="button" data-target="day-5">Day 5</button>
    </nav>
  </header>
  <main>
    <section class="intro" aria-label="行程資訊">
      <p class="eyebrow">Your Japan journey</p>
      <h1 id="trip-title"></h1>
      <p class="intro-date" id="trip-dates"></p>
      <div class="file-actions" aria-label="行程檔案工具">
        <button class="file-action primary" id="export-itinerary" type="button">匯出 JSON</button>
        <button class="file-action" id="import-itinerary" type="button">匯入 JSON</button>
        <input id="import-file" type="file" accept=".json,application/json">
      </div>
    </section>
    <div id="itinerary"></div>
    <p class="footer">旅途愉快 · Have a lovely trip</p>
  </main>
  <script>
    // 行程資料內嵌於此檔，無須網路或外部套件即可開啟。
    let itinerary = {
      "行程名稱": "易遊網｜絕景丹後關西三都5日",
      "出發日期": "2027-01-30",
      "每日行程": [
        {
          "第幾天": 1, "日期": "2027-01-30",
          "景點清單": [
            { "名稱": "桃園國際機場", "簡短說明": "集合辦理出境手續，搭乘中華航空 CI172 前往大阪。" },
            { "名稱": "大阪關西國際機場", "簡短說明": "抵達關西海上空港後前往住宿飯店。" }
          ],
          "早餐": "溫暖的家", "午餐": "溫暖的家", "晚餐": "機上套餐、日式壽司便當及飲料（贈送，價值約￥1,000）",
          "住宿飯店": "Loisir 東寺（含大浴場）、CHISUN PREMIUM 九條（含大浴場）、京都 CHISUN 堀川五條、Urban Hotel 系列（含大浴場）或同級（依實際安排）"
        },
        {
          "第幾天": 2, "日期": "2027-01-31",
          "景點清單": [
            { "名稱": "伊根灣觀光船與舟屋群", "簡短說明": "搭船遊覽伊根灣，欣賞海灣沿岸船屋與海景。" },
            { "名稱": "天橋立", "簡短說明": "日本三景之一，沿沙洲松林欣賞海灣景色；安排前往傘松公園或天橋立 View Land，搭乘纜車眺望景觀。" },
            { "名稱": "京都美山町北村合掌造聚落", "簡短說明": "漫步茅草屋聚落，欣賞田園與傳統建築風景。" }
          ],
          "早餐": "飯店內早餐", "午餐": "天橋立精選旬味海鮮御膳或季節料理和風膳食（約￥2,500）", "晚餐": "方便遊玩，敬請自理",
          "住宿飯店": "Loisir 東寺（含大浴場）、CHISUN PREMIUM 九條（含大浴場）、京都 CHISUN 堀川五條、Urban Hotel 系列（含大浴場）或同級（依實際安排）"
        },
        {
          "第幾天": 3, "日期": "2027-02-01",
          "景點清單": [
            { "名稱": "伏見稻荷大社", "簡短說明": "參觀以朱紅色千本鳥居聞名的神社。" },
            { "名稱": "宇治平等院", "簡短說明": "世界文化遺產，以國寶鳳凰堂及庭園聞名。" },
            { "名稱": "平等院表參道", "簡短說明": "漫步宇治街道，感受茶香與在地商店街氛圍。" },
            { "名稱": "宇治上神社", "簡短說明": "世界文化遺產，參觀古老神社建築；每人獲贈兔子御神籤一個。" },
            { "名稱": "大阪免稅店", "簡短說明": "安排購物停留。" },
            { "名稱": "道頓堀、心齋橋、御堂筋大道或梅田地下街", "簡短說明": "自由逛街，可依個人喜好選擇大阪購物與美食區域。" }
          ],
          "早餐": "飯店內享用", "午餐": "方便遊玩，敬請自理", "晚餐": "和牛涮涮鍋吃到飽或和牛燒肉吃到飽（約￥4,500）",
          "住宿飯店": "大阪心齋橋 GRAND、Holiday Inn 御堂筋、NOKU 大阪、Sarasa 心齋橋、KOKO、WBF 元町或同級（依實際安排）"
        },
        {
          "第幾天": 4, "日期": "2027-02-02",
          "景點清單": [
            { "名稱": "全日自由活動", "簡短說明": "當日不含固定團體景點，可自行安排大阪行程。" },
            { "名稱": "通天閣與新世界商店街（推薦）", "簡短說明": "可登塔眺望市景，或逛商店街、品嚐美食。" },
            { "名稱": "四天王寺（推薦）", "簡短說明": "參觀歷史悠久的寺院、佛塔與日式庭園。" },
            { "名稱": "大阪天滿宮（推薦）", "簡短說明": "祭祀學問之神菅原道真的神社。" }
          ],
          "早餐": "飯店內早餐", "午餐": "方便遊玩，敬請自理", "晚餐": "方便遊玩，敬請自理",
          "住宿飯店": "大阪心齋橋 GRAND、Holiday Inn 御堂筋、NOKU 大阪、Sarasa 心齋橋、KOKO、WBF 元町或同級（依實際安排）"
        },
        {
          "第幾天": 5, "日期": "2027-02-03",
          "景點清單": [
            { "名稱": "奈良公園", "簡短說明": "漫步公園並與梅花鹿互動，行程贈送鹿仙貝（兩人一份）。" },
            { "名稱": "購物中心（三選一，依實際安排）", "簡短說明": "SEVEN PARK 天美、AEON 臨空泉南或三井 LaLaport 堺，安排購物與休憩。" },
            { "名稱": "關西國際機場", "簡短說明": "搭乘中華航空 CI173 返回台北。" }
          ],
          "早餐": "飯店內早餐", "午餐": "為方便遊玩，敬請自理", "晚餐": "機上套餐", "住宿飯店": null
        }
      ]
    };

    const importedDataStorageKey = "kansai-itinerary-import-v1";
    const isValidItinerary = (data) => data && typeof data === "object" &&
      typeof data.行程名稱 === "string" && Array.isArray(data.每日行程) && data.每日行程.length > 0 &&
      data.每日行程.every((day) => day && typeof day === "object" && typeof day.第幾天 === "number" &&
        typeof day.日期 === "string" && Array.isArray(day.景點清單) &&
        day.景點清單.every((place) => place && typeof place.名稱 === "string" && typeof place.簡短說明 === "string") &&
        typeof day.早餐 === "string" && typeof day.午餐 === "string" && typeof day.晚餐 === "string" &&
        (typeof day.住宿飯店 === "string" || day.住宿飯店 === null));
    try {
      const importedData = localStorage.getItem(importedDataStorageKey);
      if (importedData) {
        const parsedData = JSON.parse(importedData);
        if (isValidItinerary(parsedData)) itinerary = parsedData;
      }
    } catch { /* 無法存取本機儲存時，使用此 HTML 內嵌的行程。 */ }

    const esc = (value) => String(value ?? "");
    const make = (tag, className, text) => {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    };
    const dateParts = (iso) => iso.split("-").map(Number);
    const localDate = (iso) => { const [y, m, d] = dateParts(iso); return new Date(y, m - 1, d); };
    const formatDate = (iso) => new Intl.DateTimeFormat("zh-TW", { year: "numeric", month: "long", day: "numeric", weekday: "long" }).format(localDate(iso));

    document.title = itinerary.行程名稱;
    document.getElementById("trip-title").textContent = itinerary.行程名稱;
    const days = itinerary.每日行程;
    document.getElementById("trip-dates").textContent = `${formatDate(days[0].日期)} — ${formatDate(days[days.length - 1].日期)}`;
    const container = document.getElementById("itinerary");
    const mealItems = [["早餐", "早餐"], ["午餐", "午餐"], ["晚餐", "晚餐"]];
    const orderStorageKey = "kansai-itinerary-stop-order-v1";
    const nameStorageKey = "kansai-itinerary-stop-names-v1";
    let savedOrder = {};
    let savedNames = {};
    try { savedOrder = JSON.parse(localStorage.getItem(orderStorageKey) || "{}"); } catch { savedOrder = {}; }
    try { savedNames = JSON.parse(localStorage.getItem(nameStorageKey) || "{}"); } catch { savedNames = {}; }

    // 景點使用來源日與原始索引作為穩定識別，支援跨日移動後還原。
    const stopKey = (dayNumber, originalIndex) => `${dayNumber}:${originalIndex}`;
    const stopsByKey = new Map();
    const originalStopsByDay = new Map();
    for (const day of days) {
      const originalStops = day.景點清單.map((place, originalIndex) => {
        const key = stopKey(day.第幾天, originalIndex);
        return { ...place, 名稱: typeof savedNames[key] === "string" ? savedNames[key] : place.名稱, _stopKey: key };
      });
      originalStopsByDay.set(String(day.第幾天), originalStops);
      originalStops.forEach((place) => stopsByKey.set(place._stopKey, place));
    }
    const claimedKeys = new Set(Object.values(savedOrder).flatMap((keys) => Array.isArray(keys) ? keys : []));
    const placedKeys = new Set();
    for (const day of days) {
      const dayKey = String(day.第幾天);
      const reordered = [];
      const order = savedOrder[dayKey];
      if (Array.isArray(order)) {
        order.forEach((key) => {
          const place = stopsByKey.get(key);
          if (place && !placedKeys.has(key)) { reordered.push(place); placedKeys.add(key); }
        });
      }
      (originalStopsByDay.get(dayKey) || []).forEach((place) => {
        if (!claimedKeys.has(place._stopKey) && !placedKeys.has(place._stopKey)) {
          reordered.push(place);
          placedKeys.add(place._stopKey);
        }
      });
      day.景點清單 = reordered;
    }

    for (const day of days) {
      const section = make("section", "day-section");
      section.id = `day-${day.第幾天}`;
      section.setAttribute("aria-labelledby", `heading-${day.第幾天}`);
      const heading = make("div", "day-heading");
      const titleGroup = make("div", "day-title");
      titleGroup.append(make("span", "day-number", `DAY ${day.第幾天}`));
      const h2 = make("h2", "", "每日行程");
      h2.id = `heading-${day.第幾天}`;
      titleGroup.append(h2);
      heading.append(titleGroup, make("time", "weekday", formatDate(day.日期)));
      section.append(heading);

      const panel = make("div", "panel");
      panel.append(make("h3", "panel-title", "TODAY'S STOPS"));
      panel.append(make("p", "drag-hint", "拖曳左側點點可排序或移到別天；雙擊／點兩下名稱可修改"));
      const places = make("div", "places");
      day.景點清單.forEach((place, index) => {
        const row = make("article", "place");
        row.dataset.stopKey = place._stopKey;
        row.dataset.day = String(day.第幾天);
        const handle = document.createElement("button");
        handle.type = "button";
        handle.className = "drag-handle";
        handle.draggable = true;
        handle.setAttribute("aria-label", `拖曳或用方向鍵調整${place.名稱}順序`);
        handle.title = "按住拖曳調整順序；也可用方向鍵移動";
        handle.innerHTML = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="7" cy="5" r="1.4"/><circle cx="13" cy="5" r="1.4"/><circle cx="7" cy="10" r="1.4"/><circle cx="13" cy="10" r="1.4"/><circle cx="7" cy="15" r="1.4"/><circle cx="13" cy="15" r="1.4"/></svg>';
        row.append(handle);
        row.append(make("span", "pin", String(index + 1)));
        const copy = make("div", "");
        const placeName = make("div", "place-name", esc(place.名稱));
        placeName.tabIndex = 0;
        placeName.title = "雙擊或快速點兩下即可修改名稱";
        placeName.setAttribute("aria-label", `${place.名稱}；雙擊或點兩下修改名稱`);
        copy.append(placeName);
        copy.append(make("p", "place-desc", esc(place.簡短說明)));
        const map = document.createElement("a");
        map.className = "map-link";
        map.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.名稱)}`;
        map.target = "_blank";
        map.rel = "noopener noreferrer";
        map.setAttribute("aria-label", `在 Google 地圖搜尋${place.名稱}`);
        map.innerHTML = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.8"/></svg><span>地圖</span>';
        row.append(copy, map);
        places.append(row);
      });
      panel.append(places);
      const meals = make("div", "meals");
      for (const [key, label] of mealItems) {
        const meal = make("div", "meal");
        meal.append(make("span", "meal-label", label), make("span", "", esc(day[key])));
        meals.append(meal);
      }
      panel.append(meals);
      section.append(panel);

      const hotel = make("aside", "hotel");
      hotel.append(make("p", "hotel-label", "住宿飯店"));
      hotel.append(make("p", day.住宿飯店 ? "hotel-name" : "hotel-name no-hotel", day.住宿飯店 || "當日返台，無住宿安排"));
      section.append(hotel);
      container.append(section);
    }

    const persistStopOrder = () => {
      try {
        const current = JSON.parse(localStorage.getItem(orderStorageKey) || "{}");
        document.querySelectorAll(".day-section").forEach((section) => {
          const dayNumber = section.id.replace("day-", "");
          const places = section.querySelector(".places");
          current[dayNumber] = [...places.querySelectorAll(":scope > .place")].map((row) => row.dataset.stopKey);
        });
        localStorage.setItem(orderStorageKey, JSON.stringify(current));
      } catch { /* 私密瀏覽等環境若停用儲存，排序仍可在目前頁面使用。 */ }
    };
    const refreshNumbers = (places) => {
      places.querySelectorAll(":scope > .place").forEach((row, index) => {
        const number = row.querySelector(".pin");
        if (number) number.textContent = String(index + 1);
      });
    };
    const renamePlace = (nameElement) => {
      const row = nameElement.closest(".place");
      const place = row && stopsByKey.get(row.dataset.stopKey);
      if (!place || nameElement.querySelector("input")) return;
      const input = make("input", "rename-input");
      input.type = "text";
      input.maxLength = 120;
      input.value = place.名稱;
      nameElement.replaceChildren(input);
      input.focus();
      input.select();
      let completed = false;
      const finish = (save) => {
        if (completed) return;
        completed = true;
        const nextName = input.value.trim();
        if (save && nextName) {
          place.名稱 = nextName;
          nameElement.textContent = nextName;
          nameElement.setAttribute("aria-label", `${nextName}；雙擊或點兩下修改名稱`);
          const mapLink = row.querySelector(".map-link");
          if (mapLink) {
            mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(nextName)}`;
            mapLink.setAttribute("aria-label", `在 Google 地圖搜尋${nextName}`);
          }
          savedNames[row.dataset.stopKey] = nextName;
          try { localStorage.setItem(nameStorageKey, JSON.stringify(savedNames)); } catch { /* 儲存停用時仍保留目前頁面的修改。 */ }
        } else {
          nameElement.textContent = place.名稱;
        }
      };
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") { event.preventDefault(); finish(true); input.blur(); }
        if (event.key === "Escape") { event.preventDefault(); finish(false); input.blur(); }
      });
      input.addEventListener("blur", () => finish(true), { once: true });
    };
    document.querySelectorAll(".place-name").forEach((nameElement) => {
      nameElement.addEventListener("dblclick", (event) => { event.preventDefault(); renamePlace(nameElement); });
      nameElement.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === "F2") { event.preventDefault(); renamePlace(nameElement); }
      });
      let lastTap = 0;
      nameElement.addEventListener("touchend", (event) => {
        const now = Date.now();
        if (now - lastTap < 360) {
          event.preventDefault();
          lastTap = 0;
          renamePlace(nameElement);
        } else {
          lastTap = now;
        }
      }, { passive: false });
    });
    let activeDrag = null;
    const beginDrag = (row, handle, pointerId = null) => {
      const places = row?.parentElement;
      if (!row || !places) return;
      activeDrag = { row, places, dayNumber: row.dataset.day, handle, pointerId };
      row.classList.add("dragging");
    };
    const moveDrag = (x, y, fallbackPlaces = null, fallbackTarget = null) => {
      if (!activeDrag) return;
      const hit = document.elementFromPoint(x, y) || fallbackTarget;
      const target = hit?.closest?.(".place") || fallbackTarget?.closest?.(".place");
      const destination = target?.parentElement || hit?.closest?.(".places") || fallbackPlaces;
      if (!destination?.classList.contains("places") || !document.getElementById("itinerary").contains(destination)) return;
      document.querySelectorAll(".drag-over").forEach((el) => el.classList.remove("drag-over"));
      if (target && target !== activeDrag.row) {
        const rect = target.getBoundingClientRect();
        const insertBefore = y < rect.top + rect.height / 2;
        destination.insertBefore(activeDrag.row, insertBefore ? target : target.nextSibling);
        target.classList.add("drag-over");
      } else if (!target) {
        destination.append(activeDrag.row);
      }
      activeDrag.places = destination;
      activeDrag.dayNumber = destination.closest(".day-section")?.id.replace("day-", "");
      activeDrag.row.dataset.day = activeDrag.dayNumber;
    };
    const finishDrag = () => {
      if (!activeDrag) return;
      const { row, handle, pointerId } = activeDrag;
      row.classList.remove("dragging");
      document.querySelectorAll(".drag-over").forEach((el) => el.classList.remove("drag-over"));
      document.querySelectorAll(".places").forEach(refreshNumbers);
      persistStopOrder();
      try { if (pointerId !== null && handle.hasPointerCapture(pointerId)) handle.releasePointerCapture(pointerId); } catch { /* 指標可能已自然釋放。 */ }
      activeDrag = null;
    };
    const dragHandles = [...document.querySelectorAll(".drag-handle")];
    // Pointer Events 直接追蹤滑鼠或手指；舊版瀏覽器另用原生拖放／Touch Events。
    dragHandles.forEach((handle) => {
      handle.addEventListener("dragstart", (event) => {
        const row = handle.closest(".place");
        if (!row) return;
        beginDrag(row, handle);
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", row.dataset.stopKey);
        try { event.dataTransfer.setDragImage(row, Math.min(40, row.offsetWidth / 2), 20); } catch { /* 使用瀏覽器預設拖曳預覽。 */ }
      });
      handle.addEventListener("dragend", finishDrag);
      handle.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
        const row = handle.closest(".place");
        if (!row) return;
        event.preventDefault();
        const places = row.parentElement;
        if (event.key === "ArrowUp" && row.previousElementSibling) places.insertBefore(row, row.previousElementSibling);
        if (event.key === "ArrowDown" && row.nextElementSibling) places.insertBefore(row.nextElementSibling, row);
        refreshNumbers(places);
        persistStopOrder();
      });
    });
    if ("PointerEvent" in window) {
      dragHandles.forEach((handle) => {
        handle.draggable = false;
        handle.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          event.preventDefault();
          beginDrag(handle.closest(".place"), handle, event.pointerId);
        });
      });
      document.addEventListener("pointermove", (event) => {
        if (!activeDrag || activeDrag.pointerId !== event.pointerId) return;
        if (event.cancelable) event.preventDefault();
        moveDrag(event.clientX, event.clientY, null, event.target);
      }, { passive: false });
      document.addEventListener("pointerup", (event) => {
        if (activeDrag && activeDrag.pointerId === event.pointerId) finishDrag();
      });
      document.addEventListener("pointercancel", (event) => {
        if (activeDrag && activeDrag.pointerId === event.pointerId) finishDrag();
      });
    } else {
      document.addEventListener("touchstart", (event) => {
        const handle = event.target.closest?.(".drag-handle");
        if (!handle || event.touches.length !== 1) return;
        event.preventDefault();
        beginDrag(handle.closest(".place"), handle);
      }, { passive: false });
      document.addEventListener("touchmove", (event) => {
        if (!activeDrag || event.touches.length !== 1) return;
        event.preventDefault();
        moveDrag(event.touches[0].clientX, event.touches[0].clientY);
      }, { passive: false });
      document.addEventListener("touchend", finishDrag, { passive: true });
      document.addEventListener("touchcancel", finishDrag, { passive: true });
    }
    document.querySelectorAll(".places").forEach((places) => {
      places.addEventListener("dragover", (event) => {
        if (!activeDrag) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        moveDrag(event.clientX, event.clientY, places, event.target);
      });
      places.addEventListener("drop", (event) => {
        if (!activeDrag) return;
        event.preventDefault();
        moveDrag(event.clientX, event.clientY, places, event.target);
        finishDrag();
      });
    });

    document.getElementById("export-itinerary").addEventListener("click", () => {
      const output = JSON.parse(JSON.stringify(itinerary));
      output.每日行程 = days.map((day) => {
        const exportedDay = { ...day };
        const section = document.getElementById(`day-${day.第幾天}`);
        exportedDay.景點清單 = [...section.querySelectorAll(":scope .places > .place")].map((row) => {
          const place = stopsByKey.get(row.dataset.stopKey);
          return place ? { 名稱: place.名稱, 簡短說明: place.簡短說明 } : null;
        }).filter(Boolean);
        return exportedDay;
      });
      const blob = new Blob([JSON.stringify(output, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "itinerary.json";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    const importInput = document.getElementById("import-file");
    document.getElementById("import-itinerary").addEventListener("click", () => importInput.click());
    importInput.addEventListener("change", () => {
      const file = importInput.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const importedData = JSON.parse(String(reader.result));
          if (!isValidItinerary(importedData)) throw new Error("資料格式不符合行程 JSON 欄位。");
          localStorage.setItem(importedDataStorageKey, JSON.stringify(importedData));
          localStorage.removeItem(orderStorageKey);
          localStorage.removeItem(nameStorageKey);
          window.location.reload();
        } catch (error) {
          alert(`匯入失敗：${error.message || "無法讀取此 JSON 檔案。"}`);
          importInput.value = "";
        }
      };
      reader.onerror = () => {
        alert("匯入失敗：無法讀取所選檔案。");
        importInput.value = "";
      };
      reader.readAsText(file, "UTF-8");
    });

    const navButtons = [...document.querySelectorAll(".day-nav button")];
    navButtons.forEach((button) => button.addEventListener("click", () => {
      document.getElementById(button.dataset.target)?.scrollIntoView({ behavior: "smooth", block: "start" });
    }));
    if ("IntersectionObserver" in window) {
      const observer = new IntersectionObserver((entries) => {
        const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!visible) return;
        const current = visible.target.id;
        navButtons.forEach((button) => {
          const active = button.dataset.target === current;
          button.classList.toggle("active", active);
          if (active) button.setAttribute("aria-current", "date"); else button.removeAttribute("aria-current");
        });
      }, { rootMargin: "-125px 0px -62% 0px", threshold: [0, .1, .3, .6] });
      document.querySelectorAll(".day-section").forEach((section) => observer.observe(section));
    }

    // 當地日期落在旅程日期範圍內時，自動定位到對應日。
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const todayDay = days.find((day) => {
      const date = localDate(day.日期);
      return date.getFullYear() === today.getFullYear() && date.getMonth() === today.getMonth() && date.getDate() === today.getDate();
    });
    if (todayDay) requestAnimationFrame(() => document.getElementById(`day-${todayDay.第幾天}`).scrollIntoView({ block: "start" }));
  </script>
</body>
</html>
